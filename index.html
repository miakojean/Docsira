    <title>DocSira</title>
    <style>
      #initial-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        background: radial-gradient(circle at 50% 45%, #ffffff 0%, #f1f5f9 100%);
      }
      #initial-boot-splash svg {
        width: 116px;
        height: 116px;
        filter: drop-shadow(0 8px 20px rgba(12, 48, 108, 0.14));
        animation: boot-levitate 2.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      @keyframes boot-levitate {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-4px) scale(1.015); }
      }
    </style>
  </head>
